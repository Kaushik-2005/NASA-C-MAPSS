stages:
  validate_raw:
    cmd: python -m src.data.validate_raw --report reports/fd001-data-quality.json
    deps:
      - src/data/checksums.py
      - src/data/ingest.py
      - src/data/schema.py
      - src/data/validate_raw.py
      - data/raw/train_FD001.txt
      - data/raw/test_FD001.txt
      - data/raw/RUL_FD001.txt
      - data/checksums.sha256
    outs:
      - reports/fd001-data-quality.json
  train:
    cmd: python -m src.training.train
    deps:
      - src/training/train.py
      - src/training/trees.py
      - src/evaluation/metrics.py
      - src/features/build_features.py
      - src/features/preprocessing.py
      - src/data/ingest.py
      - src/data/labels.py
      - src/data/samples.py
      - src/data/splits.py
      - data/raw/train_FD001.txt
      - configs/xgboost-candidate-v1.json
      - models/feature_preprocessor_v1.joblib
    outs:
      - models/xgboost_candidate_v1.joblib
      - reports/training-lineage.json
